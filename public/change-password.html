<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trocar senha — UPDOWN</title><link rel="stylesheet" href="/css/style.css"><style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#06121c;color:#eaf7ff;font-family:Arial}.card{width:min(430px,calc(100vw - 32px));padding:30px;border:1px solid #28506b;border-radius:16px;background:#091b2a}.field{margin:14px 0}.field label{display:block;font-size:11px;margin-bottom:6px}.field input{width:100%;box-sizing:border-box;padding:12px;background:#071621;color:#fff;border:1px solid #2c526b;border-radius:8px}.btn{width:100%;padding:12px;border:0;border-radius:8px;background:#0878ff;color:#fff;font-weight:800}.msg{margin-top:12px;font-size:12px}
</style><link rel="stylesheet" href="/css/uiux-v4.css">
</head><body><main class="card"><h2>Trocar senha</h2><p>Por segurança, altere a senha inicial antes de continuar.</p><form id=f><div class=field><label>SENHA ATUAL</label><input id=old type=password required></div><div class=field><label>NOVA SENHA (mínimo 8 caracteres)</label><input id=nw type=password minlength=8 required></div><div class=field><label>CONFIRMAR NOVA SENHA</label><input id=cf type=password minlength=8 required></div><button class=btn>Salvar nova senha</button><div class=msg id=m></div></form></main><script>
f.onsubmit=async e=>{e.preventDefault();m.textContent="";if(nw.value!==cf.value){m.textContent="As senhas não coincidem.";return}const r=await fetch("/api/auth/change-password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({oldPassword:old.value,newPassword:nw.value})});const d=await r.json();if(!r.ok){m.textContent=d.error||"Erro";return}location.href="/";}
</script></body></html>
