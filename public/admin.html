<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administração — UPDOWN</title><link rel="stylesheet" href="/css/style.css"><style>
body{margin:0;background:#071521;color:#eaf7ff;font-family:Arial}.wrap{max-width:1200px;margin:30px auto;padding:0 18px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.tabs{display:flex;gap:8px;margin-bottom:15px}.tab{padding:10px 14px;border:1px solid #2c526b;background:#0b2132;color:#bcd0de;border-radius:8px;cursor:pointer}.tab.active{background:#0878ff;color:white}.panel{background:#091b2a;border:1px solid #294c62;border-radius:12px;padding:18px;overflow:auto}.grid{display:grid;grid-template-columns:repeat(4,minmax(140px,1fr));gap:10px}.grid input,.grid select{padding:10px;background:#061520;color:#fff;border:1px solid #31566c;border-radius:7px}.btn{padding:10px 14px;border:0;border-radius:7px;background:#0878ff;color:white;font-weight:700;cursor:pointer}.table{width:100%;border-collapse:collapse;margin-top:15px}.table th,.table td{padding:10px;border-bottom:1px solid #1d3a4d;text-align:left;font-size:12px}.danger{background:#6f2630}.msg{margin-top:10px;font-size:12px}.hidden{display:none}
</style></head><body><div class=wrap><div class=head><div><h1>Administração</h1><p>Usuários, permissões e auditoria</p></div><a href="/">Voltar</a></div><div class=tabs><button class="tab active" data-tab=users>Usuários</button><button class=tab data-tab=audit>Auditoria</button></div>
<section id=users class=panel><h2>Novo usuário</h2><form id=uf><div class=grid><input id=un placeholder="Usuário" required><input id=dn placeholder="Nome" required><input id=pw type=password placeholder="Senha (8+)" required><select id=role><option>viewer</option><option>editor</option><option>admin</option></select></div><br><button class=btn>Criar usuário</button></form><div id=um class=msg></div><table class=table><thead><tr><th>Usuário</th><th>Nome</th><th>Perfil</th><th>Ativo</th><th>Último acesso</th><th>Ações</th></tr></thead><tbody id=ut></tbody></table></section>
<section id=audit class="panel hidden"><h2>Log de auditoria</h2><p>As alterações de usuários e da topologia são registradas no servidor com usuário, data/hora, IP e estado anterior/posterior.</p><table class=table><thead><tr><th>Data</th><th>Usuário</th><th>Ação</th><th>Recurso</th><th>IP</th><th>Detalhes</th></tr></thead><tbody id=at></tbody></table></section>
</div><script>
async function api(u,o){const r=await fetch(u,o);const d=await r.json();if(!r.ok)throw Error(d.error||"Erro");return d}
async function loadUsers(){const a=await api("/api/users");ut.innerHTML=a.map(u=>`<tr><td>${u.username}</td><td>${u.display_name}</td><td>${u.role}</td><td>${u.active?"SIM":"NÃO"}</td><td>${u.last_login_at||"—"}</td><td><button onclick="toggleUser(${u.id},${u.active})">${u.active?"Desativar":"Ativar"}</button> <button class=danger onclick="deleteUser(${u.id})">Excluir</button></td></tr>`).join("")}
async function toggleUser(id,active){try{await api("/api/users/"+id,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({active:!active})});loadUsers()}catch(e){alert(e.message)}}
async function deleteUser(id){if(!confirm("Excluir este usuário? A ação será auditada."))return;try{await api("/api/users/"+id,{method:"DELETE"});loadUsers()}catch(e){alert(e.message)}}
async function loadAudit(){const a=await api("/api/audit?limit=300");at.innerHTML=a.map(x=>`<tr><td>${x.occurred_at}</td><td>${x.username||"sistema"}</td><td>${x.action}</td><td>${x.resource_type} ${x.resource_id||""}</td><td>${x.ip||""}</td><td><details><summary>ver</summary><pre>${JSON.stringify({before:x.before_json,after:x.after_json,details:x.details_json},null,2)}</pre></details></td></tr>`).join("")}
uf.onsubmit=async e=>{e.preventDefault();um.textContent="";try{await api("/api/users",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:un.value,display_name:dn.value,password:pw.value,role:role.value})});um.textContent="Usuário criado. No primeiro acesso ele deverá trocar a senha.";uf.reset();loadUsers()}catch(e){um.textContent=e.message}}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");users.classList.toggle("hidden",b.dataset.tab!=="users");audit.classList.toggle("hidden",b.dataset.tab!=="audit");if(b.dataset.tab==="audit")loadAudit()})
loadUsers();
</script></body></html>
