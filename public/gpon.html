<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UPDOWN • Topologia GPON</title>
<meta name="description" content="Mapa da topologia da rede GPON da UPDOWN TELECOM.">
<link rel="icon" href="/assets/brand/updown-symbol.png">
<meta name="theme-color" content="#050d17">
<meta name="color-scheme" content="dark light">
<link rel="stylesheet" href="/css/noc/tokens.css?v=20260818-2">
<link rel="stylesheet" href="/css/noc/base.css">
<link rel="stylesheet" href="/css/noc/components.css?v=20260818-2">
<link rel="stylesheet" href="/css/noc/screens.css?v=20260818-6">
<script src="/js/auth-guard.js"></script>
</head>
<body class="topology-no-sidebar">
<a class="skip-link" href="#stage">Ir para o mapa da topologia GPON</a>
<header data-appbar></header>

<div class="shell">
  <aside data-sidebar></aside>

  <main class="content content-wide" id="main">
    <div class="topo-layout">
      <div class="topo-toolbar">
        <div class="row" style="gap:var(--s-2)">
          <div>
            <span class="kicker" id="topoKicker">Rede de acesso óptico — clique para expandir</span>
            <h1 style="font-size:var(--fs-20);margin-top:2px" id="topoTitle">Topologia GPON</h1>
          </div>
        </div>

        <div class="row wrap grow" style="justify-content:flex-end;gap:var(--s-2)">
          <div class="segmented" role="group" aria-label="Modo de visualização">
            <button type="button" data-view="mapa" aria-pressed="true" title="Mapa esquemático, sem fundo geográfico">Esquema</button>
            <button type="button" data-view="geo" aria-pressed="false" title="POPs e equipamentos GPON sobre o mapa do OpenStreetMap, na localização cadastrada">Mapa</button>
            <button type="button" data-view="lista" aria-pressed="false">Lista</button>
          </div>
          <button class="btn btn-sm topo-filter-toggle" id="toggleFilters" type="button" aria-expanded="false" aria-controls="filterPanel">
            <span id="filterButtonIcon" aria-hidden="true"></span><span>Filtros</span>
            <span class="topo-filter-count" id="activeFilterCount" hidden>0</span>
          </button>
          <button class="btn btn-sm" id="expandAll" type="button">Expandir tudo</button>
          <button class="btn btn-sm" id="btnFlow" type="button" aria-pressed="true">Tráfego</button>
          <button class="btn btn-sm" id="btnLayout" type="button" aria-pressed="false"
                  data-action="topology.edit topology.layout">Editar layout</button>
          <button class="btn btn-sm btn-primary" id="btnManage" type="button"
                  data-action="topology.edit">Gerenciar rede</button>
        </div>

        <div class="topo-filter-panel" id="filterPanel" aria-hidden="true" inert>
          <div class="topo-filter-panel-inner">
            <div class="input-affix topo-filter-search">
              <span class="affix-icon" id="iconSearch"></span>
              <input class="input" id="deviceSearch" type="search" placeholder="Filtrar equipamentos…" aria-label="Filtrar equipamentos">
            </div>
            <div class="row wrap topo-filter-categories" id="catFilters" role="group" aria-label="Filtrar por categoria"></div>
            <div class="topo-filter-summary">
              <span class="dim" id="listCount">—</span>
              <button class="btn btn-ghost btn-sm" id="clearFilters" type="button">Limpar</button>
            </div>
            <div class="topo-filter-results">
              <div class="device-list" id="deviceList"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="topo-main" id="topoMain">
        <section class="topo-stage" id="stage" tabindex="0" role="application"
                 aria-label="Mapa da topologia GPON. Use as setas para deslocar e as teclas mais e menos para aproximar.">
          <div class="topo-world" id="world">
            <!-- Fundo geográfico: só recebe tiles no modo "Mapa OSM". -->
            <div class="topo-basemap" id="basemap" aria-hidden="true" hidden></div>
            <svg class="topo-svg" id="edges" viewBox="0 0 1000 600" preserveAspectRatio="none" aria-hidden="true"></svg>
            <div id="nodes"></div>
          </div>

          <div class="panel topo-legend" id="legend">
            <div class="row"><i class="dot dot-ok"></i><span>Porta com enlace documentado</span></div>
            <div class="row"><i class="dot"></i><span>Porta livre e disponível</span></div>
            <div class="row"><i class="dot" style="background:var(--purple-400)"></i><span>Rota da rede óptica</span></div>
          </div>

          <!-- POPs ainda sem localização cadastrada não têm onde ser desenhados. -->
          <div class="panel topo-hud topo-missing" id="geoMissing" hidden></div>

          <p class="topo-attrib" id="geoAttrib" hidden>
            Fundo do mapa:
            <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">© OpenStreetMap contributors</a>
          </p>

          <div class="panel topo-hud topo-layout-bar" id="layoutBar" hidden>
            <span class="row" style="gap:6px">
              <b style="font-size:var(--fs-12)">Editando o layout</b>
              <span class="dim" id="layoutStatus" style="font-size:var(--fs-11)"></span>
            </span>
            <span style="width:1px;height:20px;background:var(--line)"></span>
            <button class="btn btn-sm" id="layoutAuto" type="button" title="Volta todos os POPs para o posicionamento automático">Layout automático</button>
            <button class="btn btn-sm" id="layoutDiscard" type="button">Descartar</button>
            <button class="btn btn-sm btn-primary" id="layoutSave" type="button">Salvar posições</button>
          </div>

          <div class="panel topo-hud">
            <button class="btn btn-ghost btn-icon btn-sm" id="zoomOut" type="button" aria-label="Afastar" title="Afastar (−)"></button>
            <span class="mono dim" id="zoomLabel" style="min-width:44px;text-align:center">100%</span>
            <button class="btn btn-ghost btn-icon btn-sm" id="zoomIn" type="button" aria-label="Aproximar" title="Aproximar (+)"></button>
            <span style="width:1px;height:20px;background:var(--line)"></span>
            <button class="btn btn-ghost btn-icon btn-sm" id="zoomFit" type="button" aria-label="Ajustar à tela" title="Ajustar à tela (0)"></button>
          </div>
        </section>

        <section id="listView" hidden style="padding:var(--s-5);overflow:auto">
          <div class="table-wrap">
            <table class="table" aria-label="Equipamentos da topologia GPON">
              <thead>
                <tr>
                  <th>Equipamento</th><th>POP</th><th>Categoria</th>
                  <th class="num">Portas</th><th class="num">Em uso</th><th class="num">Livres</th>
                  <th style="min-width:150px">Ocupação</th><th></th>
                </tr>
              </thead>
              <tbody id="listBody"></tbody>
            </table>
          </div>
        </section>
      </div>
    </div>
  </main>
</div>

<nav data-mobile-nav aria-label="Navegação"></nav>

<script src="/js/noc-ui.js"></script>
<script src="/js/noc-api.js"></script>
<script src="/js/noc-geo.js"></script>
<script src="/js/noc-topology.js?v=20260818-3"></script>
</body>
</html>
