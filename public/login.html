<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UPDOWN TELECOM — Acesso</title>
<link rel="stylesheet" href="/css/style.css">
<style>
body.login-page{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 10%,#12355b 0,#071521 38%,#030a10 100%);font-family:Arial,sans-serif;color:#eaf7ff}
.login-card{width:min(420px,calc(100vw - 32px));padding:32px;border:1px solid #28506b;border-radius:18px;background:rgba(7,23,36,.94);box-shadow:0 25px 80px rgba(0,0,0,.4)}
.brand{font-size:24px;font-weight:900;letter-spacing:-.04em}.brand span{color:#1dc9ff}.sub{color:#91aabd;font-size:13px;margin:7px 0 28px}
.field{margin:15px 0}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:7px;color:#b8ccda}.field input{width:100%;box-sizing:border-box;padding:13px;border-radius:9px;border:1px solid #2c526b;background:#091b2a;color:#fff;outline:none}.field input:focus{border-color:#1595ff;box-shadow:0 0 0 3px rgba(21,149,255,.13)}
.btn{width:100%;padding:13px;border:0;border-radius:9px;background:#0878ff;color:#fff;font-weight:800;cursor:pointer;margin-top:10px}.btn:hover{filter:brightness(1.08)}
.error{display:none;margin-top:14px;padding:11px;border-radius:8px;background:#401c25;color:#ffb9c2;font-size:12px}.hint{margin-top:18px;color:#748d9e;font-size:11px;line-height:1.5}
</style>
</head>
<body class="login-page">
<main class="login-card">
  <div class="brand">UPDOWN <span>TELECOM</span></div>
  <div class="sub">Topologia de Rede • Acesso administrativo</div>
  <form id="loginForm">
    <div class="field"><label>USUÁRIO</label><input id="username" autocomplete="username" required></div>
    <div class="field"><label>SENHA</label><input id="password" type="password" autocomplete="current-password" required></div>
    <button class="btn" type="submit">Entrar</button>
    <div class="error" id="error"></div>
  </form>
  <div class="hint">No primeiro acesso, o usuário administrador deverá trocar a senha inicial.</div>
</main>
<script>
const form=document.getElementById("loginForm"), error=document.getElementById("error");
form.addEventListener("submit",async e=>{
 e.preventDefault(); error.style.display="none";
 try{
  const r=await fetch("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:username.value,password:password.value})});
  const d=await r.json();
  if(!r.ok) throw new Error(d.error||"Não foi possível entrar.");
  location.href=d.user.must_change_password?"/change-password.html":"/";
 }catch(err){error.textContent=err.message;error.style.display="block";}
});
fetch("/api/auth/me").then(r=>r.json()).then(d=>{if(d.authenticated) location.href="/";});
</script>
</body>
</html>
