<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UPDOWN • Agenda</title>
<meta name="description" content="Agenda de compromissos pessoal e do setor, com alertas de horário.">
<link rel="icon" href="/assets/brand/favicon.ico" sizes="any">
<link rel="icon" href="/assets/brand/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#050d17">
<meta name="color-scheme" content="dark light">
<link rel="stylesheet" href="/css/noc/tokens.css?v=20260818-2">
<link rel="stylesheet" href="/css/noc/base.css">
<link rel="stylesheet" href="/css/noc/components.css?v=20260819-9">
<link rel="stylesheet" href="/css/noc/screens.css?v=20260818-1">
<link rel="stylesheet" href="/css/noc/agenda.css?v=20260818-2">
<script src="/js/auth-guard.js"></script>
</head>
<body>
<a class="skip-link" href="#main">Ir para o conteúdo</a>
<header data-appbar></header>
<div class="shell">
  <main class="content" id="main">
    <div class="page-head agenda-head">
      <div>
        <span class="kicker">Compromissos e alertas</span>
        <h1 class="page-title">Agenda</h1>
        <p class="page-sub">Escolha entre sua agenda pessoal, a agenda do setor ou visualize as duas juntas.</p>
      </div>
      <div class="row wrap">
        <button class="btn" id="todayBtn" type="button">Hoje</button>
        <button class="btn btn-icon" id="prevBtn" type="button" aria-label="Mês anterior"></button>
        <button class="btn btn-icon" id="nextBtn" type="button" aria-label="Próximo mês"></button>
        <button class="btn btn-primary" id="newEventBtn" type="button" data-action="agenda.create"></button>
      </div>
    </div>

    <div class="agenda-toolbar card">
      <div class="row wrap grow" id="calendarFilters" aria-label="Selecionar agenda pessoal ou do setor"></div>
      <div class="google-state" id="importState"></div>
    </div>

    <div class="agenda-layout">
      <section class="card agenda-calendar" aria-labelledby="monthTitle">
        <div class="card-head"><h2 id="monthTitle">—</h2><span class="badge" id="eventCount">0 compromissos</span></div>
        <div class="calendar-weekdays" aria-hidden="true"><span>Dom</span><span>Seg</span><span>Ter</span><span>Qua</span><span>Qui</span><span>Sex</span><span>Sáb</span></div>
        <div class="calendar-grid" id="calendarGrid" aria-live="polite"></div>
      </section>
      <aside class="card agenda-upcoming">
        <div class="card-head"><div><h2>Próximos</h2><p>Compromissos visíveis no mês.</p></div></div>
        <div class="card-body stack" id="upcomingList"></div>
      </aside>
    </div>
  </main>
</div>
<nav data-mobile-nav aria-label="Navegação"></nav>
<script src="/js/noc-tempo.js?v=20260825"></script>
<script src="/js/noc-ui.js?v=20260825-1"></script>
<script src="/js/noc-api.js"></script>
<script src="/js/noc-agenda.js?v=20260825-1"></script>
</body>
</html>
